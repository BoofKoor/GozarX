[project]
name = "gozar"
version = "0.1.0"
description = "Gozar v2 — Telegram trial-config bot (Remnawave) + admin panel"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "aiogram>=3.13,<4",
    "sqlalchemy[asyncio]>=2.0.35",
    "asyncpg>=0.30",
    "alembic>=1.13",
    "redis>=5.2",
    "arq>=0.26",
    "httpx>=0.27",
    "pydantic>=2.9",
    "pydantic-settings>=2.5",
    "bcrypt>=4.2",
    "pyjwt>=2.9",
    "pywebpush>=2.3.0",
]

[dependency-groups]
dev = [
    "ruff>=0.7",
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "fakeredis>=2.21",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["gozar"]

[tool.ruff]
target-version = "py312"
line-length = 100
extend-exclude = ["migrations/versions"]

[tool.ruff.lint]
# E/F = pycodestyle+pyflakes, I = isort, UP = pyupgrade, B = bugbear,
# T20 = flake8-print (T201 bans print()), ASYNC = async pitfalls.
select = ["E", "F", "I", "UP", "B", "T20", "ASYNC"]

[tool.ruff.lint.per-file-ignores]
"gozar/seed.py" = ["E501"]  # long translated copy strings
"gozar/seed_landings.py" = ["E501"]  # long translated landing-page bodies

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
