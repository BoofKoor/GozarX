# Phase 0: HTTP-only reverse proxy. TLS (443) + the ACME/certbot companion are
# added by the Phase 9 installer. Routes the bot webhook, panel webhook, admin
# API, and health to the app; serves the SPA build for everything else.

upstream gozar_app {
    server app:8000;
}

upstream gozar_site {
    server site:3100;
}

server {
    listen 80;
    server_name _;

    client_max_body_size 2m;

    # Telegram webhook -> app (the secret path segment is validated by the app).
    location /tg/ {
        proxy_pass http://gozar_app;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Remnawave panel webhook -> app.
    location = /panel-webhook {
        proxy_pass http://gozar_app;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Admin REST API -> app.
    location /api/ {
        proxy_pass http://gozar_app;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location = /health {
        proxy_pass http://gozar_app;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Admin SPA under /admin/ (built with Vite base "/admin/", copied to html/admin).
    location = /admin { return 301 /admin/; }
    location /admin/ {
        root /usr/share/nginx/html;
        try_files $uri /admin/index.html;
    }

    # Everything else -> the Next.js website (the domain root belongs to the site).
    location / {
        proxy_pass http://gozar_site;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
