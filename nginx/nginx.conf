# Phase 0: HTTP-only reverse proxy. TLS (443) + the ACME/certbot companion are
# added by the Phase 9 installer. Routes the bot webhook, panel webhook, admin
# API, and health to the app; serves the SPA build for everything else.

upstream gozar_app {
    server app:8000;
}

upstream gozar_site {
    server site:3100;
}

server {
    listen 80;
    server_name _;

    client_max_body_size 2m;

    # Text assets compressed at the origin (Cloudflare re-compresses for the browser, but the SPA's
    # ~1 MB of JavaScript no longer crosses the origin link uncompressed).
    gzip on;
    gzip_comp_level 5;
    gzip_min_length 1024;
    gzip_types text/css application/javascript application/json image/svg+xml text/plain;

    # Telegram webhook -> app (the secret path segment is validated by the app).
    location /tg/ {
        proxy_pass http://gozar_app;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Remnawave panel webhook -> app.
    location = /panel-webhook {
        proxy_pass http://gozar_app;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Admin REST API -> app.
    location /api/ {
        proxy_pass http://gozar_app;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location = /health {
        proxy_pass http://gozar_app;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Admin SPA under /admin/ (Vite base "/admin/", copied to html/admin by Dockerfile.frontend).
    location = /admin { return 301 /admin/; }
    # Hashed build output never changes under a name, so it is cached for a year. A MISSING asset is
    # a 404, not index.html with a 200: a tab left open across a deploy asks for chunks of the old
    # build, and that must fail as a failed import (the SPA reloads itself) rather than hand the
    # browser an HTML page to execute as JavaScript.
    location /admin/assets/ {
        root /usr/share/nginx/html;
        try_files $uri =404;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }
    location /admin/fonts/ {
        root /usr/share/nginx/html;
        try_files $uri =404;
        add_header Cache-Control "public, max-age=2592000";
    }
    location /admin/ {
        root /usr/share/nginx/html;
        try_files $uri /admin/index.html;
        # The shell is revalidated on every load; a heuristically cached index points at chunks a
        # newer build has already removed.
        add_header Cache-Control "no-cache";
    }

    # Everything else -> the Next.js website (the domain root belongs to the site).
    location / {
        proxy_pass http://gozar_site;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
