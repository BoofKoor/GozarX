# Phase 0: HTTP-only reverse proxy. TLS (443) + the ACME/certbot companion are
# added by the Phase 9 installer. Routes the bot webhook, panel webhook, admin
# API, and health to the app; serves the SPA build for everything else.

upstream gozar_app {
    server app:8000;
}

server {
    listen 80;
    server_name _;

    client_max_body_size 2m;

    # Telegram webhook -> app (the secret path segment is validated by the app).
    location /tg/ {
        proxy_pass http://gozar_app;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Remnawave panel webhook -> app.
    location = /panel-webhook {
        proxy_pass http://gozar_app;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Admin REST API -> app.
    location /api/ {
        proxy_pass http://gozar_app;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location = /health {
        proxy_pass http://gozar_app;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # SPA static (admin panel). Phase 7 mounts the built assets here; until then
    # this serves the default placeholder page.
    location / {
        root /usr/share/nginx/html;
        try_files $uri /index.html;
    }
}
