    document.getElementById("ftc1").innerHTML='<h4>'+t("ftc_product")+'</h4><a href="#">'+t("ft_get")+'</a><a href="#">'+t("ft_loc")+'</a><a href="#">'+t("ft_rewards")+'</a><a href="#">'+t("ft_status")+'</a>';
    document.getElementById("ftc2").innerHTML='<h4>'+t("ftc_resources")+'</h4><a href="#">'+t("ft_guides")+'</a><a href="#">'+t("ft_faq")+'</a><a href="#">'+t("ft_blog")+'</a><a href="#">'+t("ft_about")+'</a>';
    document.getElementById("ftc3").innerHTML='<h4>'+t("ftc_legal")+'</h4><a href="#">'+t("ft_terms")+'</a><a href="#">'+t("ft_privacy")+'</a><a href="#">'+t("ft_contact")+'</a>';
  }

  function toast(msg){ var el=document.createElement("div"); el.className="toast"; el.innerHTML=svg("check",2.6)+'<span>'+msg+'</span>'; document.getElementById("toasts").appendChild(el); setTimeout(function(){el.remove();},2600); }

  /* ---- interactions ---- */
  app.addEventListener("click",function(e){
    var el=e.target.closest("[data-action]"); if(el){ var act=el.getAttribute("data-action"),inHero=!!el.closest("#hero-widget");
      if(act==="pick-loc"){ var g=el.closest(".loc-grid2"); g.querySelectorAll(".loc-card").forEach(function(c){c.setAttribute("aria-pressed","false");}); el.setAttribute("aria-pressed","true"); if(inHero)heroSel=+el.getAttribute("data-i"); return; }
      if(act==="claim"){ if(heroSel<0)heroSel=0; renderHero("provisioning"); setTimeout(function(){renderHero("success");},1600); return; }
      if(act==="copy"){ var link=el.getAttribute("data-link"); if(navigator.clipboard)navigator.clipboard.writeText(link).catch(function(){}); var o=el.textContent; el.textContent=t("copied"); el.classList.add("copied"); setTimeout(function(){el.textContent=o;el.classList.remove("copied");},1400); return; }
      if(act==="qr"){ var card=el.closest(".widget"),panel=card.querySelector(".qr-panel"); if(panel.classList.toggle("show"))drawQR(panel.querySelector("canvas")); return; }
      if(act==="dismiss"){ var m=el.closest(".missions"); if(m)m.classList.add("hide"); return; }
      if(act==="acc"){ var a=el.closest(".acc"); a.setAttribute("data-open",a.getAttribute("data-open")==="true"?"false":"true"); return; }
      if(act==="noop"){ e.preventDefault(); toast(t("toast_demo")); return; }
    }
    if(e.target.closest("[data-close-sheet]")) closeSheet();
  });

  /* mobile sheet */
  function openSheet(){ document.getElementById("sheet-ov").classList.add("open"); document.getElementById("sheet").classList.add("open"); }
  function closeSheet(){ document.getElementById("sheet-ov").classList.remove("open"); document.getElementById("sheet").classList.remove("open"); }
  document.getElementById("burger").addEventListener("click",openSheet);
  document.getElementById("sheet-ov").addEventListener("click",closeSheet);

  /* countdown */
  function fmt(r,p){ if(p==="h")return Math.floor(r/3600); if(p==="m")return Math.floor((r%3600)/60); return r%60; }
  function pad(n){ return String(n).padStart(2,"0"); }
  function syncCd(){ document.querySelectorAll(".js-cd").forEach(function(el){ var r=+el.getAttribute("data-remain")||0; el.querySelector(".h").textContent=faD(pad(fmt(r,"h"))); el.querySelector(".m").textContent=faD(pad(fmt(r,"m"))); el.querySelector(".s").textContent=faD(pad(fmt(r,"s"))); }); }
  setInterval(function(){ document.querySelectorAll(".js-cd").forEach(function(el){ var r=Math.max(0,(+el.getAttribute("data-remain")||0)-1); el.setAttribute("data-remain",r); el.querySelector(".h").textContent=faD(pad(fmt(r,"h"))); el.querySelector(".m").textContent=faD(pad(fmt(r,"m"))); el.querySelector(".s").textContent=faD(pad(fmt(r,"s"))); }); },1000);

  /* reveal on scroll */
  var io=("IntersectionObserver" in window)?new IntersectionObserver(function(es){ es.forEach(function(en){ if(en.isIntersecting){ en.target.classList.add("in"); io.unobserve(en.target);} }); },{threshold:.12}):null;
  function bindReveal(){ document.querySelectorAll(".reveal").forEach(function(el){ if(io)io.observe(el); else el.classList.add("in"); }); }

  /* i18n + render */
  function applyStatic(){ app.querySelectorAll("[data-i18n]").forEach(function(el){ el.textContent=t(el.getAttribute("data-i18n")); }); }
  function renderAll(){ applyStatic(); renderNav(); renderHeroCopy(); renderHero("idle"); renderSteps(); renderLocs(); renderMissions(); renderApps(); renderStats(); renderFaq(); renderTrust(); renderBlog(); renderFooter(); bindReveal(); }

  /* language banner */
  function maybeBanner(){ var bl=(navigator.language||"").toLowerCase(); var want=bl.indexOf("fa")===0?"fa":"en"; if(want!==locale){ document.getElementById("lang-banner").classList.remove("hide"); } }
  document.getElementById("banner-x").addEventListener("click",function(){ document.getElementById("lang-banner").classList.add("hide"); });
  document.getElementById("banner-switch").addEventListener("click",function(){ setLocale(locale==="fa"?"en":"fa"); document.getElementById("lang-banner").classList.add("hide"); });

  /* locale / theme / platform */
  function setLocale(l){ locale=l; app.setAttribute("data-locale",l); app.setAttribute("dir",l==="fa"?"rtl":"ltr"); app.setAttribute("lang",l);
    ["loc-fa","loc-fa2","loc-fa3"].forEach(function(id){var e=document.getElementById(id);if(e)e.setAttribute("aria-pressed",l==="fa");});
    ["loc-en","loc-en2","loc-en3"].forEach(function(id){var e=document.getElementById(id);if(e)e.setAttribute("aria-pressed",l==="en");});
    renderAll(); }
  function setTheme(th){ app.setAttribute("data-theme",th); document.querySelectorAll("canvas").forEach(function(c){ delete c.dataset.drawn; drawQR(c); }); }
  function setPlatform(p){ platform=p; ["ios","android","desktop"].forEach(function(x){ document.getElementById("pf-"+x).setAttribute("aria-pressed",x===p); }); renderHero("idle"); renderApps(); }
  ["loc-fa","loc-fa2","loc-fa3"].forEach(function(id){ document.getElementById(id).addEventListener("click",function(){setLocale("fa");}); });
  ["loc-en","loc-en2","loc-en3"].forEach(function(id){ document.getElementById(id).addEventListener("click",function(){setLocale("en");}); });
  document.getElementById("th-toggle").addEventListener("click",function(){ setTheme(app.getAttribute("data-theme")==="dark"?"light":"dark"); });
  document.getElementById("pf-ios").addEventListener("click",function(){setPlatform("ios");});
  document.getElementById("pf-android").addEventListener("click",function(){setPlatform("android");});
  document.getElementById("pf-desktop").addEventListener("click",function(){setPlatform("desktop");});

  var rt=document.documentElement.getAttribute("data-theme"), pd=window.matchMedia&&window.matchMedia("(prefers-color-scheme: dark)").matches;
  app.setAttribute("data-theme", rt==="dark"||(!rt&&pd)?"dark":"light");
  new MutationObserver(function(){ var v=document.documentElement.getAttribute("data-theme"); if(v==="dark"||v==="light") app.setAttribute("data-theme",v); }).observe(document.documentElement,{attributes:true,attributeFilter:["data-theme"]});
  ["ios","android","desktop"].forEach(function(x){ document.getElementById("pf-"+x).setAttribute("aria-pressed",x===platform); });

  setLocale("fa");
  maybeBanner();
})();
</script>
