name: gozar

# Shared definition for the two backend roles (app + worker) so the image is
# built once and reused.
x-backend: &backend
  build:
    context: .
    dockerfile: docker/Dockerfile.backend
  image: gozar-backend:local
  env_file: .env
  restart: unless-stopped
  depends_on:
    postgres:
      condition: service_healthy
    redis:
      condition: service_healthy

services:
  postgres:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-gozar}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-gozar}
      POSTGRES_DB: ${POSTGRES_DB:-gozar}
    volumes:
      - pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER:-gozar} -d $${POSTGRES_DB:-gozar}"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  app:
    <<: *backend
    command: ["/entrypoint.sh"]
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8000/health"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  worker:
    <<: *backend
    command: ["python", "-m", "gozar.worker.main"]

  site:
    # The Next.js website (standalone server on :3100). nginx proxies `/` here in production.
    build:
      context: .
      dockerfile: docker/Dockerfile.site
      args:
        # SEO: canonical origin for robots.txt/sitemap.xml/OG tags, plus the optional Google Search
        # Console "HTML tag" token. This MUST be the PUBLIC WEBSITE host (SITE_DOMAIN) — under domain
        # separation DOMAIN is the admin/bot host, whose nginx block 301s everything to /admin/, so
        # deriving it from DOMAIN pointed every canonical + sitemap URL at a redirect-to-panel and
        # made the site un-indexable. Falls back to DOMAIN for a shared single-domain install.
        SITE_URL: https://${SITE_DOMAIN:-${DOMAIN:-gozarx.gozarxservices.com}}
        GOOGLE_SITE_VERIFICATION: ${GOOGLE_SITE_VERIFICATION:-}
    image: gozar-site:local
    restart: unless-stopped
    # No backend secrets: the site only serves pages. Browser /api requests are routed to the app by
    # nginx. The SEO landings (/l/{slug}), /locations and the hourly-revalidated sitemap fetch the
    # backend SERVER-side at http://app:8000 (BACKEND_ORIGIN, set for both build + runtime stages in
    # Dockerfile.site); the SEO origin/verification token are baked at build time via the args above.
    depends_on:
      app:
        condition: service_started
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:3100/"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s

  nginx:
    # Builds the admin SPA into the nginx image (docker/Dockerfile.frontend); the SPA is served
    # from /usr/share/nginx/html by the mounted nginx.conf. The Phase 9 TLS overlay only adds
    # 443 + cert mounts to this same service, so it merges cleanly.
    build:
      context: .
      dockerfile: docker/Dockerfile.frontend
    image: gozar-nginx:local
    restart: unless-stopped
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    ports:
      - "80:80"
    depends_on:
      app:
        condition: service_healthy
      site:
        condition: service_started

volumes:
  pg_data:
  redis_data:
